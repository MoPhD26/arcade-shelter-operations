name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arcade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the expression catalog is current
        run: npm run check-catalog
      - name: Run every Arcade expression against its tests
        run: npm test
